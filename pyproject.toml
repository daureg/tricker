[project]
name = "tricker"
authors = [{name = "Géraud Le Falher", email = "daureg@gmail.com"}]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
# those are defined in the top level __init__.py and it's docstring
dynamic = ["version", "description"]
# https://iscinumpy.dev/post/bound-version-constraints/#pinning-the-python-version-is-special
requires-python = ">=3.13"
dependencies = [
]

[dependency-groups]
dev = [
    "ty>=0.0.30",
    "pygments>=2.19.2",
    "pytest-cov>=7.0.0",
    "deptry>=0.24.0",
]

[build-system]
requires = ["flit_core >=3.12,<4"]
build-backend = "flit_core.buildapi"

[tool.ruff]
line-length = 88
target-version = "py313"
exclude = []
[tool.ruff.format]
preview = true
[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = [
    "CPY",
    "BLE001", # those LLMs really like to catch blind exceptions
    "TD",
    "FIX002",
    "DOC201",
 # https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
    "COM812",
    "COM819",
    "D206",
    "D300",
    "E111",
    "E114",
    "E117",
    "E501",
    "Q000",
    "Q001",
    "Q002",
    "Q003",
    "W191",
]
[tool.ruff.lint.extend-per-file-ignores]
"tests/**/*.py" = [
    "S101", # asserts allowed in tests...
    "D100", # https://google.github.io/styleguide/pyguide.html#3821-test-modules
    "INP001", # https://docs.pytest.org/en/stable/explanation/goodpractices.html#which-import-mode
    "PLR2004", 	# magic-value-comparison
    "PLR6301", # no-self-use
    "PLC0415" , # `import` should be at the top-level of a file
]
"scripts/**/*.py" = [
    "INP001",
]
[tool.ruff.lint.flake8-annotations]
mypy-init-return = true
[tool.ruff.lint.isort]
force-single-line = true
[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
minversion = "9.0"
addopts = "--strict-markers --cov=travel_blog --cov-branch --cov-report html"
testpaths = ["tests"]

[tool.pyright]
include = ["src/", "tests/"]
exclude = [
    "**/__pycache__",
]
pythonVersion = "3.13"
pythonPlatform = "Linux"
typeCheckingMode = "basic"

[tool.deptry.per_rule_ignores]
DEP003 = [
    "tricker"
]
